name: Container image

# The image and the chart are released independently, and this workflow owns
# only the image. The chart has its own workflow and its own tag series
# (`domestique-<chart version>`), because a chart fix and an app change are
# rarely the same event: you can ship a values default without rebuilding the
# app, and you can ship the app without touching the chart. What links them is
# the chart's `appVersion`, which is the image tag the chart deploys — bump it
# when you want the chart to pick up a new release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded main build is worth cancelling; a release build never is.
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Docker Hub is a mirror, and an optional one: a fork, or a repo that has
      # not set the credentials, should still publish to GHCR rather than fail.
      # `secrets` is not available to a step-level `if`, so the decision becomes
      # an output here.
      #
      # The namespace comes from the DOCKERHUB_USERNAME *variable* (org-level),
      # the credential from the DOCKERHUB_PASSWORD *secret*. Both must be set:
      # a password with no namespace has nowhere to push.
      - id: registries
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          hub_path=""
          if [ -n "$DOCKERHUB_PASSWORD" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            # An image reference may not contain uppercase, and the variable is
            # free text somebody typed.
            hub_path="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/domestique"
          fi

          {
            echo "images<<EOF"
            # Hardcoded lowercase rather than ${{ github.repository }}: an image
            # reference may not contain uppercase, and the repository is
            # `wncservices/Domestique`. Deriving it would produce a name the
            # registry rejects.
            echo "ghcr.io/wncservices/domestique"
            if [ -n "$hub_path" ]; then
              echo "docker.io/${hub_path}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "hub_path=${hub_path}" >> "$GITHUB_OUTPUT"

          if [ -n "$hub_path" ]; then
            echo "mirror=true" >> "$GITHUB_OUTPUT"
            echo "Mirroring to docker.io/${hub_path}"
          else
            echo "mirror=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub skipped::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_PASSWORD secret to mirror there. Published to GHCR only."
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.registries.outputs.mirror == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # One build, pushed to both registries under the same tags, so the
          # two can never drift apart.
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            # Every build, tagged or not, is also addressable by commit. `dev`
            # moves under you; this is what you pin when you want to know
            # exactly what is running.
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well: the cluster this runs on is mixed-architecture.
          # Both stages cross-compile, so this is not the QEMU tax it looks like.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attested against GHCR only. Both registries hold the same digest, so
      # the attestation covers the Docker Hub copy too — but GHCR is where the
      # referrers API is dependable, so that is where it is pushed.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/wncservices/domestique
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A private package pushes fine and only fails when something tries to
      # pull it — in the cluster, days later. GHCR has no API for visibility,
      # so this cannot be fixed here; a warning is the most CI can do.
      - name: Warn if the image is not publicly pullable
        env:
          MIRROR: ${{ steps.registries.outputs.mirror }}
          HUB_PATH: ${{ steps.registries.outputs.hub_path }}
        run: |
          ghcr_token=$(curl -sf "https://ghcr.io/token?scope=repository:wncservices/domestique:pull&service=ghcr.io" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${ghcr_token}" \
            https://ghcr.io/v2/wncservices/domestique/tags/list)
          if [ "$code" != "200" ]; then
            echo "::warning title=GHCR package is private::Anonymous pull returned ${code}. Set the package public under Package settings → Danger Zone → Change visibility, or deployments need an imagePullSecret."
          else
            echo "GHCR: anonymous pull works."
          fi

          if [ "$MIRROR" = "true" ]; then
            hub_token=$(curl -sf "https://auth.docker.io/token?scope=repository:${HUB_PATH}:pull&service=registry.docker.io" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${hub_token}" \
              "https://registry-1.docker.io/v2/${HUB_PATH}/tags/list")
            if [ "$code" != "200" ]; then
              echo "::warning title=Docker Hub repository is private::Anonymous pull returned ${code}. Make ${HUB_PATH} public in its Docker Hub settings."
            else
              echo "Docker Hub: anonymous pull works."
            fi
          fi

          # In *this* repository the mirror is not optional, and a skipped
          # mirror is invisible: the job pushes to GHCR and reports success. It
          # already happened once — an organisation secret defaults to
          # "Private repositories", and this repository is public, so the
          # credentials silently never arrived.
          #
          # Deliberately last, after the image and its attestation are safely
          # pushed: the failure is the report, not a reason to lose the build.
          if [ "$MIRROR" != "true" ] && [ "$GITHUB_REPOSITORY" = "wncservices/Domestique" ]; then
            echo "::error title=Docker Hub mirror was skipped::The image reached GHCR but not Docker Hub. Check that the DOCKERHUB_USERNAME variable and DOCKERHUB_PASSWORD secret exist AND that their organisation-level Repository access includes this public repository."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
