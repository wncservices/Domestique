name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well: the cluster this runs on is mixed-architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The binary serves the frontend from disk, so ship them together.
      - run: npm ci
      - run: npm run build

      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/domestique_${version}_${os}_${arch}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "$out/domestique" ./apps/api/cmd/domestique
            cp -r apps/web/dist "$out/web"
            cp README.md LICENSE domestique.example.yaml "$out/"
            tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
            rm -rf "$out"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
