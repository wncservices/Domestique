name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly. Both jobs can start failing without any code change — a new CVE
    # lands in the Go vulnerability database, or CodeQL ships a new query — so
    # they must run on a timer, not only on pushes.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: apps/api

  aikido:
    name: Aikido
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # The Aikido GitHub App scans this repo on its own; this job exists to
      # *gate* a PR on the result. Without the key it skips rather than fails,
      # so forked PRs (which never receive secrets) are not blocked.
      AIKIDO_SECRET_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
    steps:
      - name: Skip when no key is configured
        if: env.AIKIDO_SECRET_KEY == ''
        run: |
          echo "::notice::AIKIDO_SECRET_KEY is not set — PR gating skipped." \
               "Add it from https://app.aikido.dev/settings/integrations/continuous-integration"

      - uses: AikidoSec/github-actions-workflow@v1.0.13
        if: env.AIKIDO_SECRET_KEY != ''
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Block only on what would actually reach a user. SAST and IaC
          # gating are paid-plan features; leave them reporting, not blocking.
          minimum-severity: HIGH
          fail-on-dependency-scan: true
          fail-on-timeout: false
          post-scan-status-comment: only_if_new_findings

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The frontend ships no server-side code, so dev-only advisories are
      # noise. Fail on anything that reaches a user.
      - run: npm audit --omit=dev --audit-level=high
