version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec

  settings:
    errcheck:
      # Writing to stdout/stderr and flushing a tabwriter cannot fail in a way
      # the CLI could act on; checking them adds noise to every print.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (hash.Hash).Write

    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104

  exclusions:
    rules:
      # Tests deliberately ignore errors on teardown and read fixtures by path.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
