# A complete deployment: PostgreSQL, a reverse proxy doing authentication,
# Traefik ingress, credentials from a Secret. Everything here is a placeholder
# — substitute your own hosts, groups and accounts.
#
# Also rendered by CI, so it stays valid.
config:
  # No source.dsn: DOMESTIQUE_SOURCE_DSN comes from the Secret below, so the
  # password never lands in a ConfigMap.
  source: {}

  auth:
    mode: proxy
    trusted_proxies:
      - 10.0.0.0/8            # your pod CIDR
    roles:
      admin:
        - route-admins
      rider:
        - riders
      viewer:
        - guests
    default_role: viewer

  komoot:
    enabled: true

  # No accounts here: riders link their own head units from the UI.

# Create this Secret yourself — an ExternalSecret from a secret manager, for
# instance. It must carry DOMESTIQUE_SOURCE_DSN, and KOMOOT_EMAIL /
# KOMOOT_PASSWORD when Komoot import is on.
envFrom:
  - secretRef:
      name: domestique

# With PostgreSQL there is nothing left to keep on disk.
postgresql:
  # The operator publishes domestique-db-app; the chart reads it.
  cluster: domestique-db

encryptionKey:
  existingSecret: domestique

ingressRoute:
  enabled: true
  match: Host(`domestique.example.com`)
  middlewares:
    - name: internal
      namespace: traefik
  tls:
    certResolver: letsencrypt
