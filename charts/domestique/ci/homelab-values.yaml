# How this is deployed in the cluster it was written for: PostgreSQL from the
# CNPG cluster, Authelia in front, Traefik IngressRoute, credentials from Vault
# via an ExternalSecret. Also exercised by `helm template` in CI.
config:
  source:
    kind: db
    # No dsn here: DOMESTIQUE_SOURCE_DSN comes from the Secret below, so the
    # password never lands in a ConfigMap.
  auth:
    mode: proxy
    trusted_proxies:
      - 10.42.0.0/16
    roles:
      admin:
        - domestique-admins
      rider:
        - cyclists
      viewer:
        - guests
    default_role: viewer
  komoot:
    enabled: true
  accounts:
    - id: garmin:wilant
      provider: garmin
      rider: wilant
      label: Wilant's Garmin Edge
    - id: wahoo:friend
      provider: wahoo
      rider: friend
      label: Friend's Wahoo ELEMNT
  default_targets:
    - garmin:wilant
    - wahoo:friend

# Created by an ExternalSecret pulling kv2_tooling/domestique/env from Vault.
envFrom:
  - secretRef:
      name: domestique

# Only the state file needs to live here once routes are in PostgreSQL.
persistence:
  enabled: true
  size: 256Mi

ingressRoute:
  enabled: true
  match: Host(`domestique.wilant.be`)
  middlewares:
    - name: internal
      namespace: traefik
  tls:
    certResolver: cloudflare
