apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
spec:
  # One replica on purpose. Two would race on the state file and on the remote
  # ids it records; see values.yaml.
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "domestique.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pod when the config changes, so an edit to values takes
        # effect without anyone remembering to bounce it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "domestique.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "domestique.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: domestique
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - serve
            - --addr=:8080
            - --config=/app/domestique.yaml
            - --state=/app/data/domestique-state.json
            - --web-dir=/app/web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The DSN is the one thing this chart insists on. Sourced from a
            # Secret rather than the ConfigMap because it carries a password.
            - name: DOMESTIQUE_SOURCE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "domestique.databaseSecret" . }}
                  key: {{ include "domestique.databaseSecretKey" . }}
            {{- with .Values.encryptionKey.existingSecret }}
            - name: DOMESTIQUE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.encryptionKey.secretKey }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/domestique.yaml
              subPath: domestique.yaml
              readOnly: true
            # The root filesystem is read-only, so give the process a writable
            # temp directory rather than making the whole thing writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "domestique.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
