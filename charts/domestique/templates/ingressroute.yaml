{{- if .Values.ingressRoute.enabled -}}
{{- if not .Values.ingressRoute.match -}}
{{- fail "ingressRoute.enabled is set but ingressRoute.match is empty — e.g. Host(`domestique.example.com`)" -}}
{{- end -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "domestique.fullname" . }}
  labels:
    {{- include "domestique.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ .Values.ingressRoute.match | quote }}
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "domestique.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if or .Values.ingressRoute.tls.certResolver .Values.ingressRoute.tls.secretName }}
  tls:
    {{- with .Values.ingressRoute.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
    {{- with .Values.ingressRoute.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
