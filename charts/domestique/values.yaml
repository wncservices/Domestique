# Default values for domestique.

image:
  repository: ghcr.io/wncservices/domestique
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The app's own configuration, rendered into a ConfigMap and mounted at
# /app/domestique.yaml. Nothing secret belongs here — it is a ConfigMap, and
# readable by anyone with access to the namespace.
#
# Credentials come from `envFrom` and `env` below instead.
config:
  # No `source` here on purpose. The DSN carries a password, so it comes from
  # a Secret as DOMESTIQUE_SOURCE_DSN — see `postgresql` below — and this file
  # is a ConfigMap that anyone with namespace access can read.

  # Domestique authenticates nobody itself. Behind Traefik with an Authelia
  # forwardAuth middleware it reads the identity Authelia passes down.
  #
  # THIS DEFAULTS TO OFF, WHICH MEANS EVERY VISITOR IS AN ADMIN. Set mode to
  # proxy before exposing this to anything.
  auth:
    mode: none
    # mode: proxy
    # trusted_proxies:
    #   - 10.0.0.0/8
    # roles:
    #   admin: [route-admins]
    #   rider: [riders]
    #   viewer: [guests]
    # default_role: viewer

  komoot:
    enabled: false

  # Head units are not configured here. Riders link their own Garmin or Wahoo
  # from the web UI and it is stored in the database, so there is no second
  # place where somebody's devices are written down.

# Secrets reach the pod as environment variables. Create the Secret separately
# — with an ExternalSecret from Vault, for instance — and name it here.
#
# Keys Domestique reads:
#   DOMESTIQUE_SOURCE_DSN      PostgreSQL connection string (overrides config.source.dsn)
#   DOMESTIQUE_ENCRYPTION_KEY  base64 of 32 bytes; lets riders sign in to Komoot
#                              and Garmin from the UI. `domestique keygen`.
#                              Without it that form is not offered, and replacing
#                              it invalidates every stored sign-in.
#   GARMIN_OAUTH_CONSUMER_KEY  the OAuth1 consumer Connect's own clients use;
#   GARMIN_OAUTH_CONSUMER_SECRET  without both, the Garmin sign-in is offered
#                              as unavailable rather than as a form that fails
#   KOMOOT_EMAIL               one shared Komoot account, as an alternative to
#   KOMOOT_PASSWORD            riders signing in themselves
envFrom: []
# - secretRef:
#     name: domestique

# Individual environment variables, for anything not in a Secret.
env: []

# PostgreSQL. Required — the chart will not render without one.
#
# Routes, sync state, linked head units and Komoot sign-ins are all rows in
# one database, so the pod keeps nothing of its own. That is why there is no
# volume here any more: with PostgreSQL there was nothing left to put on it,
# and an empty PVC that silently did nothing was worse than none.
#
# SQLite still works for a laptop (`just up`, `domestique serve`). It is not
# offered as a deployment: one replica pinned to one node, holding the only
# copy of the library on a volume nothing backs up.
postgresql:
  # Name of a CloudNativePG Cluster in this namespace. The operator publishes
  # a Secret called <cluster>-app containing a ready-made connection string,
  # and this reads it — nothing to copy, and it follows a failover.
  cluster: ""

  # Or point at any Secret holding a PostgreSQL URL. Takes precedence over
  # `cluster` when both are set.
  existingSecret: ""
  secretKey: uri

# Encrypts Komoot sign-ins so riders can connect their own account from the
# UI. Without it that form is not offered — a session is stored encrypted or
# not at all — and everything else works as normal.
#
# `domestique keygen` prints one. Put it in a Secret; never in this file.
encryptionKey:
  existingSecret: ""
  secretKey: DOMESTIQUE_ENCRYPTION_KEY

service:
  type: ClusterIP
  port: 80

# A Traefik IngressRoute, which is how this is exposed in the cluster it was
# written for. For a plain Ingress, see `ingress` below.
ingressRoute:
  enabled: false
  entryPoints:
    - websecure
  # e.g. Host(`domestique.example.com`)
  match: ""
  middlewares: []
  # - name: internal
  #   namespace: traefik
  # - name: authelia
  #   namespace: authelia
  tls:
    certResolver: ""
    secretName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: domestique.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

# The ServiceAccount name matters beyond RBAC: Vault's Kubernetes auth binds a
# role to a named ServiceAccount in a namespace, so this is the identity the
# app authenticates to Vault with.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# One replica, deliberately. Two would race on the sync state and on the remote
# ids it records, and a route library is not a workload that needs scaling.
replicaCount: 1

strategy:
  type: Recreate

revisionHistoryLimit: 3

# maxUnavailable, not minAvailable: with one replica, `minAvailable: 1` blocks
# node drains forever because the node can never evict the only pod.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 1

# The app authenticates to Vault with this ServiceAccount's token, so it needs
# to be mounted. Turn off only if nothing in-cluster authenticates as the app.
automountServiceAccountToken: true

terminationGracePeriodSeconds: 30
priorityClassName: ""
topologySpreadConstraints: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# The image runs as uid 10001 and writes only to the mounted volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
